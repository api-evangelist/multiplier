aid: multiplier
url: https://raw.githubusercontent.com/api-evangelist/multiplier/refs/heads/main/apis.yml
name: Multiplier
kind: company
description: Multiplier (usemultiplier.com) is a global employment platform offering
  Employer of Record (EOR), Contractor management, and Global Payroll across 150+
  countries. Its API surface is integration-oriented - token-authenticated connections
  used to sync members (employees and contractors), employment contracts, payroll,
  payments, time off, and invoices between Multiplier and external HRIS systems such
  as Workday, HiBob, BambooHR, and Personio. Multiplier does not publish an open,
  self-serve public REST/GraphQL API reference; API access is provisioned per account
  via Service User tokens. Not to be confused with unrelated companies named
  "Multiplier".
